<style>
/* MMSU Sustainability (SDG) site, pilot. Tokens taken from mmsu.edu.ph:
   Figtree for text, Garamond for headings, dark green #0C4B05, active yellow #FACC15,
   zinc neutrals for the top bar, sidebar buttons and body text. */
:root {
  --green: #0C4B05;
  --yellow: #FACC15;
  --sdg15: #56C02B;
  --sdg15-title: #3FF500;
  --z50: #FAFAFA; --z100: #F4F4F5; --z200: #E4E4E7; --z300: #D4D4D8;
  --z500: #71717A; --z600: #52525B; --z700: #3F3F46; --z900: #18181B;
  --sans: Figtree, ui-sans-serif, system-ui, sans-serif;
  --bg: #fff; --fg: #000;
  --serif: "AGaramondPro-Regular", "EB Garamond", Garamond, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--sans); color: var(--fg); background: var(--bg); line-height: 1.5; }
a { color: inherit; }
img { max-width: 100%; }
.skip { position: absolute; left: -999px; top: 0; background: var(--yellow); color: var(--green); padding: 8px 14px; z-index: 50; }
.skip:focus { left: 8px; top: 8px; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

/* top bar */
.govbar { background: var(--z100); }
.govbar .in { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1500px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.govbar .gov { font-weight: 600; font-size: 20px; color: var(--z700); text-decoration: none; letter-spacing: .5px; }
.govbar ul { display: flex; gap: 40px; list-style: none; margin: 0; padding: 0; }
.govbar ul a { font-size: 13px; letter-spacing: 3.4px; text-transform: uppercase; color: var(--z600); text-decoration: none; }
.govbar ul a:hover { color: var(--green); }
.govbar .clock { font-size: 13px; font-weight: 600; color: var(--z700); white-space: nowrap; }
.govbar .search { background: none; border: 0; padding: 4px; color: var(--z700); cursor: pointer; }

/* identity + nav */
.ident { display: flex; justify-content: center; padding: 22px 16px 18px; }
.ident a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--z900); }
.ident img { width: 78px; height: 78px; }
.ident h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 29px; line-height: 1.05; text-transform: uppercase; letter-spacing: .2px; }
.mainnav { border-top: 1px solid var(--z200); border-bottom: 1px solid var(--z200); background: rgba(250,250,250,.9); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.mainnav ul { display: flex; flex-wrap: wrap; justify-content: center; list-style: none; margin: 0; padding: 0; }
.mainnav a { display: block; padding: 11px 22px; font-size: 14px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--z600); text-decoration: none; }
.mainnav a:hover { background: var(--z100); color: var(--green); }

/* layout */
.shell { display: grid; grid-template-columns: 360px minmax(0, 1fr); max-width: 1500px; margin: 0 auto; min-height: 70vh; }
.side { padding-block: 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 28px; border-right: 1px solid var(--z200); }
.side .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
.side .brand img { width: 190px; height: 190px; object-fit: contain; }
.side .brand h2 { font-family: var(--serif); font-weight: 700; font-size: 30px; color: var(--green); margin: 14px 0 0; line-height: 1.15; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li + li { margin-top: 6px; }
.side a { display: block; background: var(--z100); color: var(--green); font-weight: 600; font-size: 18px; padding: 12px 26px; text-decoration: none; border-radius: 3px; }
.side a:hover { background: var(--z200); }
.side a[aria-current="page"] { background: var(--yellow); }
.contact { margin-top: 36px; border: 1px solid var(--z200); border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.contact h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 24px; color: var(--green); }
.contact p { margin: 0 0 6px; font-size: 15px; color: var(--z700); }
.main { padding-block: 40px 64px; padding-left: 48px; padding-right: max(48px, env(safe-area-inset-right, 0px)); min-width: 0; }
.main.with-toc { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 40px; }
.toc { position: sticky; top: 16px; align-self: start; font-size: 14px; }
.toc h2 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--z700); margin: 0 0 10px; font-weight: 600; }
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc li { margin-bottom: 8px; }
.toc a { text-decoration: none; color: var(--z600); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toc a::before { content: "› "; }
.toc a:hover { color: var(--green); }

/* home */
.carousel { position: relative; max-width: 1010px; margin: 0 auto; }
.slide { display: none; }
.slide.on { display: block; }
.slide img { width: 100%; aspect-ratio: 1010 / 450; object-fit: cover; display: block; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.slide figcaption { text-align: center; font-family: var(--serif); font-weight: 700; font-size: 24px; color: var(--green); margin-top: 18px; }
.carousel button { position: absolute; top: 40%; transform: translateY(-50%); background: rgba(0,0,0,.35); border: 0; color: #fff; width: 44px; height: 56px; font-size: 32px; cursor: pointer; }
.carousel .prev { left: 0; } .carousel .next { right: 0; }
.carousel button:hover { background: rgba(0,0,0,.55); }
.goals-title { font-family: var(--serif); font-weight: 700; font-size: 40px; color: var(--green); text-align: center; margin: 44px 0 24px; }
.goals { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; max-width: 880px; margin: 0 auto; }
.goal { aspect-ratio: 1; padding: 8px 8px 6px; color: #fff; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.goal .n { font-weight: 700; font-size: 22px; line-height: 1; }
.goal .l { font-size: 9px; font-weight: 700; line-height: 1.1; text-transform: uppercase; position: absolute; left: 30px; top: 9px; right: 6px; }
.goal .l.two { left: 44px; }
.goal svg { width: 46%; height: 46%; align-self: center; margin-bottom: 8px; }
.goal:hover, .goal:focus-visible { filter: brightness(1.08); transform: translateY(-2px); }
.goal.live::after { content: "Pilot"; position: absolute; right: 6px; bottom: 6px; background: var(--yellow); color: var(--green); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; }
.goal.last-row { grid-column: auto; }

/* SDG page */
.sdghead { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 32px; }
.sdghead img { width: 224px; height: 224px; object-fit: cover; }
.sdghead h2 { margin: 0 0 14px; font-size: 32px; font-weight: 700; color: var(--sdg15-title); text-shadow: 0 0 1px rgba(0,0,0,.25); }
.sdghead h3 { margin: 0 0 8px; font-size: 18px; color: var(--z900); }
.sdghead p { margin: 0; font-style: italic; color: var(--z600); font-size: 18px; max-width: 640px; }
.section { padding: 26px 0 30px; border-top: 1px solid var(--z200); }
.section:first-of-type { border-top: 0; }
.section h2.sec { margin: 0 0 14px; font-size: 18px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; color: var(--z700); }
.ind { list-style: none; margin: 0; padding: 0; }
.ind li { display: flex; align-items: baseline; gap: 12px; padding: 7px 0; }
.ind .code { font-weight: 700; color: var(--green); min-width: 52px; font-size: 16px; }
.ind a { color: var(--z600); font-weight: 600; font-size: 18px; text-decoration: none; }
.ind a:hover { color: var(--green); text-decoration: underline; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.have { background: var(--sdg15); color: #0a2a05; }
.pill.none { background: var(--z100); color: var(--z600); border: 1px solid var(--z200); }

/* indicator page */
.crumbs { font-size: 14px; color: var(--z600); margin-bottom: 18px; }
.crumbs a { color: var(--green); font-weight: 600; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.indhead h2 { margin: 0 0 6px; font-size: 30px; color: var(--green); font-family: var(--serif); font-weight: 700; }
.indhead .code { display: inline-block; background: var(--sdg15); color: #0a2a05; font-weight: 700; padding: 2px 12px; border-radius: 999px; font-size: 15px; margin-right: 10px; vertical-align: middle; }
.indhead p { color: var(--z600); font-style: italic; font-size: 18px; margin: 10px 0 0; max-width: 780px; }
.infobox { background: var(--z50); border: 1px solid var(--z200); border-radius: 8px; padding: 14px 18px; margin: 22px 0 0; color: var(--z700); font-size: 15px; max-width: 780px; }
.infobox b { color: var(--green); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 30px 0 8px; }
.tools input[type=search] { font: inherit; padding: 9px 14px; border: 1px solid var(--z300); border-radius: 6px; min-width: 240px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--z300); background: #fff; color: var(--z700); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
.btn { font: inherit; font-weight: 700; font-size: 15px; padding: 9px 18px; border-radius: 6px; border: 1px solid var(--green); background: var(--green); color: #fff; cursor: pointer; }
.btn.alt { background: #fff; color: var(--green); }
.btn:hover { filter: brightness(1.15); }
.count { color: var(--z600); font-size: 14px; margin: 6px 0 4px; }
.yearhead { margin: 28px 0 10px; font-size: 18px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; color: var(--z700); border-bottom: 1px solid var(--z200); padding-bottom: 6px; }
.entry { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 18px; border: 1px solid var(--z200); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; background: #fff; }
.entry:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.entry .yr { font-weight: 700; color: var(--green); font-size: 15px; }
.entry .yr small { display: block; font-weight: 600; color: var(--z500); font-size: 12px; margin-top: 4px; }
.entry h3 { margin: 0 0 4px; font-size: 18px; line-height: 1.3; }
.entry h3 a { color: var(--green); text-decoration: none; }
.entry h3 a:hover { text-decoration: underline; }
.entry .meta { color: var(--z600); font-size: 14px; margin-bottom: 8px; }
.entry p { margin: 0 0 10px; color: var(--z700); font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.tag { padding: 2px 10px; border-radius: 999px; background: var(--z100); border: 1px solid var(--z200); color: var(--z700); font-weight: 600; }
.tag.ok { background: #e9f9e1; border-color: #bfe8ab; color: #1a5a0b; }
.tag.warn { background: #fff7d6; border-color: #f2dd8a; color: #6b4e00; }
.tag.local { background: var(--yellow); border-color: var(--yellow); color: var(--green); }
.entry .src { font-size: 14px; }
.entry .src a { color: var(--green); font-weight: 600; }
.entry .rm { margin-left: auto; font: inherit; font-size: 13px; background: none; border: 0; color: #a11; cursor: pointer; text-decoration: underline; }
.empty { border: 1px dashed var(--z300); border-radius: 8px; padding: 28px; text-align: center; color: var(--z600); background: var(--z50); }

/* modal */
dialog { border: 0; border-radius: 12px; padding: 0; width: min(620px, 94vw); box-shadow: 0 10px 40px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 24px 26px 22px; }
dialog h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 28px; color: var(--green); }
dialog .hint { margin: 0 0 16px; color: var(--z600); font-size: 14px; }
dialog label { display: block; font-weight: 600; font-size: 14px; color: var(--z700); margin: 12px 0 4px; }
dialog input, dialog select, dialog textarea { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--z300); border-radius: 6px; }
dialog textarea { min-height: 90px; resize: vertical; }
dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600; z-index: 60; }

/* footer */
.foot { background: var(--green); color: #fff; margin-top: 40px; }
.foot .in { max-width: 1300px; margin: 0 auto; padding-block: 56px 40px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 40px; }
.foot .id img { width: 140px; height: 140px; border-radius: 50%; }
.foot .id h2 { font-family: var(--serif); font-weight: 400; text-transform: uppercase; font-size: 30px; line-height: 1.1; margin: 12px 0 18px; }
.foot p { margin: 0 0 14px; font-size: 15px; }
.foot h3 { text-align: center; font-weight: 400; font-size: 20px; margin: 0 0 14px; }
.foot .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; padding-left: 28px; }
.foot a { color: #fff; text-decoration: none; font-size: 15px; }
.foot a:hover { text-decoration: underline; }
.foot .legal a { display: block; font-weight: 700; margin-bottom: 8px; }
.foot .bar { background: var(--z100); color: var(--z600); font-size: 13px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }

/* responsive */
@media (max-width: 1100px) {
  .shell { grid-template-columns: 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--z200); padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side ul { display: flex; flex-wrap: wrap; gap: 6px; }
  .side li + li { margin-top: 0; }
  .side a { padding: 9px 16px; font-size: 16px; }
  .side .brand img { width: 120px; height: 120px; }
  .contact { display: none; }
  .main { padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .main.with-toc { grid-template-columns: 1fr; }
  .toc { display: none; }
  .foot .in { grid-template-columns: 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .goals { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .govbar ul { display: none; }
  .govbar .clock { display: none; }
  .mainnav ul { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; }
  .mainnav a { padding: 10px 14px; white-space: nowrap; }
  .goals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .entry { grid-template-columns: 1fr; gap: 6px; }
  .sdghead img { width: 150px; height: 150px; }
  .goals-title { font-size: 32px; }
  .ident h1 { font-size: 21px; }
  .ident img { width: 56px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .goal { transition: none; } }
@media print { .govbar, .mainnav, .side, .toc, .tools, .foot, .btn { display: none; } .shell { display: block; } }

 management of land for agriculture."},{"code":"15.2.6","title":"Sustainable management of land for tourism (educational outreach)","question":"Offer educational programme/outreach for local or national communities on sustainable management of land for tourism."}],"short":"Education"},{"code":"15.3","heading":"Supporting land ecosystems through action","group":"SUPPORTING LAND ECOSYSTEMS THROUGH ACTION","indicators":[{"code":"15.3.1","title":"Sustainable use, conservation and restoration of land (policy)","question":"Have a policy to ensure the conservation, restoration and sustainable use of terrestrial ecosystems associated with the university, in particular forests, mountains and drylands."},{"code":"15.3.2","title":"Monitoring IUCN and other conservation species (policy)","question":"Have a policy to ensure that IUCN Red List species and national conservation list species with habitats in areas affected by university operations are identified, monitored and protected."},{"code":"15.3.3","title":"Local biodiversity included in planning and development","question":"Include local biodiversity into any planning and development process (e.g. construction of new buildings)."},{"code":"15.3.4","title":"Alien species impact reduction (policy)","question":"Have a policy to reduce the impact of alien species on campus."},{"code":"15.3.5","title":"Collaboration for shared land ecosystems","question":"Collaborate with the local community to maintain shared land ecosystems."}],"short":"Action"},{"code":"15.4","heading":"Land-sensitive waste disposal","group":"LAND SENSITIVE WASTE DISPOSAL","indicators":[{"code":"15.4.1","title":"Water discharge guidelines and standards","question":"Have water quality standards and guidelines for water discharges (to uphold water quality in order to protect ecosystems, wildlife, and human health and welfare)."},{"code":"15.4.2","title":"Policy on plastic waste reduction","question":"Have a policy on reducing plastic waste on campus."},{"code":"15.4.3","title":"Policy on hazardous waste disposal","question":"Have a policy, process or practice on waste disposal covering hazardous materials."}],"short":"Waste disposal"}],"entries":{"15.1":[{"id":"e01","years":"2025","sortYear":2025,"type":"Award","title":"From wild foods to policy innovation: MMSU's indigenous food plants program as a model for sustainable and inclusive agriculture","people":"Menisa A. Antonio, Ma. Concepcion Birginias, Josefa Pugat, Maingeline Vivit, Ruby Rose Tamayo","summary":"Best Paper, sustainable and smart agri-aquaculture and climate resilience category, 2025 SUC-ACAP Biennial Conference and General Assembly (27 to 29 August 2025, Tagbilaran City, Bohol). The paper covers conservation of wild food plants through in situ, ex situ and circa situ approaches and the adoption of the program by the Regional Development Council of Region 1.","sourceLabel":"MMSU Research Directorate, 29 August 2025","sourceUrl":"https://research.mmsu.edu.ph/news/details/mmsu-research-on-indigenous-food-plants-wins-best-paper-at-suc-acap-2025-conference","status":"Verified on the source page","note":"Conference paper; Scopus indexing not checked."},{"id":"e02","years":"2024 to 2026","sortYear":2026,"type":"Research project","title":"Nature-based Solutions (NbS) for Sustainable Mangrove Management and Resilient Coastal Communities Through Innovative Green Engineering Approach","people":"Dr. Arlene L. Gonzales (Project Leader), with DENR-PENRO Ilocos Norte, the Provincial Government and the LGUs of Badoc and Currimao","summary":"DOST-PCAARRD-funded project (1 May 2024 to 30 April 2026) in Badoc and Currimao, Ilocos Norte. It addresses the poor hydrological conditions that keep young mangrove propagules from surviving, using technology-assisted plantations and bamboo-engineered structures.","sourceLabel":"DOST-PCAARRD, 7 August 2024","sourceUrl":"https://www.pcaarrd.dost.gov.ph/index.php/quick-information-dispatch-qid-articles/dost-pcaarrd-mmsu-launch-nature-based-solutions-project-on-mangrove-management-in-ilocos-norte","status":"Verified on the source page","note":"Coastal ecosystem; the team may weigh it under SDG 14 as well."},{"id":"e03","years":"2025","sortYear":2025,"type":"Research project","title":"Enhancing the productivity of rice-based cropping systems through soil health management (Project SLaM 2023/146)","people":"Dr. Janet Villamor (MMSU project lead), with Griffith University, ACIAR and DOST-PCAARRD","summary":"MMSU joined a five-year program to develop soil knowledge and capacity for more productive and sustainable cropping systems. It evaluates nutrient management and develops yield-calibrated soil health indices for rice-garlic, rice-rice and rice-onion systems in Ilocos Norte, Tarlac and Bataan.","sourceLabel":"MMSU News, 31 March and 3 July 2025","sourceUrl":"https://www.mmsu.edu.ph/news/mmsu-tapped-as-key-partner-in-enhancing-ph-cropping-systems-through-soil-health-management","status":"Verified on the source page","note":"Agricultural soil research; confirm it falls under THE's land-ecosystems keywords."},{"id":"e04","years":"2023","sortYear":2023,"type":"Study","title":"Characterization and Evaluation of Indigenous Food Plant Species","people":"Menisa A. Antonio, Bjorn S. Santos, Maria Concepcion Birginias, Jomel Agreda, Bella Gervacio","summary":"Study under the parent project \"Strengthening the Resilience of Iloco Crop Diversity Through Complementary Conservation Approach\", with related studies on ex situ conservation facilities and community foodscapes and seedbanks. Status: extended.","sourceLabel":"MMSU Research portal, record 801","sourceUrl":"https://research.mmsu.edu.ph/research/details/801","status":"Verified on the source page"},{"id":"e05","years":"2022 to 2023","sortYear":2023,"type":"Study","title":"Documentation of Dipterocarp Species in Second Growth Forest of Ilocos Norte","people":"Bonne Jovi J. Orteza","summary":"Expected outputs: a handbook of dipterocarp species in Ilocos Norte and a map of dipterocarp forest. Status: extended.","sourceLabel":"MMSU Research portal, record 691","sourceUrl":"https://research.mmsu.edu.ph/research/details/691","status":"Verified on the source page"},{"id":"e06","years":"2017 to 2021","sortYear":2021,"type":"Study","title":"Assessment and selection of suitable indigenous timber species under denuded hilly areas in Ilocos Norte","people":"Charito Samsam, Sergia Garma, Joselito Rosario, Roseller Ayson","summary":"Completed study under the parent project on species-site suitability of indigenous timber species in denuded areas, with a related performance evaluation of promising species under different management strategies on hilly denuded land.","sourceLabel":"MMSU Research portal, records 493 and 494","sourceUrl":"https://research.mmsu.edu.ph/research/details/493","status":"Verified on the source page"},{"id":"e07","years":"2019","sortYear":2019,"type":"Award","title":"Phenology of Broussonetia luzonica (Blanco) Bur.: A Promising Indigenous Vegetable","people":"Menisa A. Antonio, Evangeline S. Galacgac, Rodel T. Utrera","summary":"Best Poster, 2019 Plant Biology Forum, University of the Philippines Los Baños (29 to 30 April 2019). The study characterised alukon (himbabao) trees in four ecological zones of Ilocos Norte: morphology, reproductive characters, growth stages and flowering habit.","sourceLabel":"MMSU News","sourceUrl":"https://www.mmsu.edu.ph/news/mmsu-savants-win-in-2019-plant-bio-forum","status":"Verified on the source page","note":"Poster; Scopus indexing not checked."},{"id":"e08","years":"2012 to 2017","sortYear":2017,"type":"Research project","title":"Resource Assessment and Evaluation of Dipterocarps and Premium Indigenous Timber Species in Ilocos Norte","people":"Joselito Rosario, Charito Samsam","summary":"Completed project that located and documented superior mother trees of dipterocarps and other indigenous timber species in Ilocos Norte and evaluated their phenotypic qualities and phenology.","sourceLabel":"MMSU Research portal, record 101","sourceUrl":"https://research.mmsu.edu.ph/research/details/101","status":"Verified on the source page"},{"id":"e09","years":"2012 to 2015","sortYear":2015,"type":"Study","title":"Documentation of Dipterocarp Species in Second Growth Forest in Selected Municipalities of Ilocos Norte","people":"Charlie Batin, Roseller Ayson, Dionisio Jamias, Erle Stanley Damaso, Mary Ann Gorospe","summary":"Documentation of dipterocarp trees dominating second-growth forests in Nueva Era, Pasuquin, Vintar, Adams and Pagudpud, with diameter, species and stocking data. Status: deferred.","sourceLabel":"MMSU Research portal, record 111","sourceUrl":"https://research.mmsu.edu.ph/research/details/111","status":"Verified on the source page"},{"id":"e10","years":"2011 to 2014","sortYear":2014,"type":"Research project","title":"Resource Assessment of Existing Potential Biofuel-Source Species in Ilocos Norte","people":"Joselito Rosario, Charito Samsam, Dionisio Jamias, Sergia Garma","summary":"Completed project that built a database of energy-producing tree species in Region I through exploration, identification, abundance and phenology studies, with DENR, DA and local governments.","sourceLabel":"MMSU Research portal, record 107","sourceUrl":"https://research.mmsu.edu.ph/research/details/107","status":"Verified on the source page","note":"Related; energy-tree species rather than conservation."},{"id":"e11","years":"2011","sortYear":2011,"type":"Publication","title":"Survey and Characterization of Indigenous Food Plants in Ilocos Norte, Philippines","people":"Menisa A. Antonio, Rodel T. Utrera, Epifania O. Agustin, Dionisio L. Jamias, Araceli J. Badar, Miriam E. Pascua","summary":"SEARCA Agriculture and Development Discussion Paper No. 2011-2 (61 pages). Documented 46 indigenous food plants from 27 families in seven upland and remote municipalities, most of them wild species, and reported that MMSU maintains their germplasm as living plants and seeds.","sourceLabel":"SEARCA Discussion Papers","sourceUrl":"https://www.searca.org/pubs/discussion-papers?pid=130","status":"Verified on the source page","note":"Discussion paper; Scopus indexing not checked."},{"id":"e12","years":"2008 to 2010","sortYear":2010,"type":"Research project","title":"Survey and characterization of indigenous food plants in Ilocos Norte, Philippines","people":"Menisa Antonio, Rodel T. Utrera, Epifania O. Agustin","summary":"Completed program (1 November 2008 to 20 June 2010) that produced the 2011 SEARCA discussion paper.","sourceLabel":"MMSU Research portal, record 766","sourceUrl":"https://research.mmsu.edu.ph/research/details/766","status":"Verified on the source page"},{"id":"e13","years":"2003","sortYear":2003,"type":"News","title":"MMSU researchers identify vanishing plant species","people":"Dr. Miriam Pascua, Menisa Antonio, Dionisio Bucao and colleagues","summary":"Survey of Laoag City, Batac, Pasuquin, San Nicolas and Dingras: of 124 plants that elders perceived to be vanishing, 77 were validated as such using IUCN criteria, 45 classified as endangered and 32 as vulnerable.","sourceLabel":"The Philippine Star, 14 September 2003","sourceUrl":"https://philstar.com/business/2003/09/14/220344/mmsu-researchers-identify-vanishing-plant-species","status":"Verified on the source page","note":"The classification applied IUCN criteria locally; it is not the IUCN Red List."},{"id":"e14","years":"Ongoing","sortYear":2027,"type":"Research centre","title":"Natural Resources Conservation and Management Center (NRCMC)","people":"Center Chief: Mae Ann R. Batuyong","summary":"MMSU's research hub for the conservation of flora and fauna in the Ilocos Region. It leads R&D on plant genetic resources characterization, conservation of plants, animals and water resources, forest resource conservation and fishery resource management.","sourceLabel":"MMSU Research Directorate, centers","sourceUrl":"https://research.mmsu.edu.ph/centers/nrcmc","statu       return;
    }
    document.title = "MMSU on Life on Land | MMSU Sustainability";
    main.className = "main with-toc";
    var toc = D.metrics.map(function (m) { return '<li><a href="#" data-scroll="m' + m.code.replace(".", "-") + '" title="' + esc(m.heading) + '">' + esc(m.code + " " + (m.short || m.heading)) + '</a></li>'; }).join("");
    var secs = D.metrics.map(function (m, k) {
      return '<section class="section" id="m' + m.code.replace(".", "-") + '"><h2 class="sec">' + esc(m.group) + '</h2><ul class="ind">' +
        m.indicators.map(function (i) {
          var c = count(i.code);
          return '<li><span class="code">' + esc(i.code) + '</span><a href="' + hrefInd(i.code) + '">' + esc(i.title) + '</a>' +
            '<span class="pill ' + (c ? "have" : "none") + '">' + (c ? c + (c === 1 ? " entry" : " entries") : "No entries yet") + '</span></li>';
        }).join("") + '</ul></section>';
    }).join("");
    main.innerHTML = '<div><div class="sdghead"><img src="' + IMG.sdg15 + '" alt="SDG 15 Life on Land"><div style="flex:1;min-width:260px"><h2>MMSU on Life on Land</h2><h3>MMSU\'s Commitment</h3><p>' + esc(D.sdg.commitment) + '</p></div></div>' + secs + '</div>' +
      '<nav class="toc" aria-label="On this page"><h2>On this page</h2><ul><li><a href="#" data-scroll="top">MMSU\'s Commitment</a></li>' + toc + '</ul></nav>';
  }

  function viewIndicator(code) {
    var ind = byCode[code];
    sideSdg(15);
    if (!ind) { main.className = "main"; main.innerHTML = '<div class="empty">Indicator not found. <a href="#sdg-15">Back to SDG 15</a></div>'; return; }
    document.title = code + " " + ind.title + " | MMSU Sustainability";
    main.className = "main with-toc";
    view = { q: "", type: "All" };
    main.innerHTML = '<div><div class="crumbs"><a href="#home">Home</a> / <a href="#sdg-15">SDG 15</a> / ' + esc(code) + '</div>' +
      '<div class="indhead" id="overview"><h2><span class="code">' + esc(code) + '</span>' + esc(ind.title) + '</h2><p>' + esc(ind.question) + '</p></div>' +
      (ind.note ? '<div class="infobox"><b>How this indicator is scored.</b> ' + esc(ind.note) + '</div>' : '') +
      (code === "15.1" ? '' : '<div class="infobox"><b>Pilot.</b> Only indicator 15.1 is filled in this pilot. You can already add an entry here; it is saved in this browser and can be exported.</div>') +
      '<div class="tools" id="entries"><input type="search" id="q" placeholder="Search entries" aria-label="Search entries"><div class="chips" id="chips"></div>' +
      '<span style="flex:1"></span><button class="btn" id="add">+ Add entry</button><button class="btn alt" id="export">Share added entries</button></div>' +
      '<div class="count" id="count" aria-live="polite"></div><div id="list"></div></div>' +
      '<nav class="toc" aria-label="On this page"><h2>On this page</h2><ul><li><a href="#" data-scroll="overview">Overview</a></li><li><a href="#" data-scroll="entries">Entries</a></li></ul></nav>';
    document.getElementById("q").addEventListener("input", function (e) { view.q = e.target.value; renderList(code); });
    document.getElementById("add").onclick = function () { openForm(code); };
    document.getElementById("export").onclick = function () { exportLocal(); };
    renderList(code);
  }

  function renderList(code) {
    var all = entriesFor(code);
    var types = ["All"]; all.forEach(function (e) { if (types.indexOf(e.type) < 0) types.push(e.type); });
    if (types.indexOf(view.type) < 0) view.type = "All";
    var chips = document.getElementById("chips");
    chips.innerHTML = types.map(function (t) { return '<button class="chip" aria-pressed="' + (t === view.type) + '" data-t="' + esc(t) + '">' + esc(t) + '</button>'; }).join("");
    Array.prototype.forEach.call(chips.querySelectorAll(".chip"), function (b) { b.onclick = function () { view.type = b.getAttribute("data-t"); renderList(code); }; });
    var q = view.q.trim().toLowerCase();
    var list = sorted(all.filter(function (e) {
      if (view.type !== "All" && e.type !== view.type) return false;
      if (!q) return true;
      return [e.title, e.people, e.summary, e.type, e.years].join(" ").toLowerCase().indexOf(q) >= 0;
    }));
    document.getElementById("count").textContent = list.length + (list.length === 1 ? " entry" : " entries") + (all.length !== list.length ? " of " + all.length : "");
    var host = document.getElementById("list");
    if (!list.length) {
      host.innerHTML = '<div class="empty">' + (all.length ? "No entries match your search." : "No entries yet for this indicator. Use \"Add entry\" to insert the first one.") + '</div>';
      return;
    }
    var html = "", last = null;
    list.forEach(function (e) {
      var g = groupLabel(e);
      if (g !== last) { html += '<h3 class="yearhead">' + esc(g) + '</h3>'; last = g; }
      var url = safeUrl(e.sourceUrl);
      html += '<article class="entry"><div class="yr">' + esc(e.years) + '<small>' + esc(e.type) + '</small></div><div>' +
        '<h3>' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(e.title) + '</a>' : esc(e.title)) + '</h3>' +
        (e.people ? '<div class="meta">' + esc(e.people) + '</div>' : '') +
        (e.summary ? '<p>' + esc(e.summary) + '</p>' : '') +
        '<div class="tags">' + (e.status ? '<span class="tag ' + (/^Verified/.test(e.status) ? "ok" : "warn") + '">' + esc(e.status) + '</span>' : '') +
        (e.local ? '<span class="tag local">Added locally</span>' : '') +
        (e.note ? '<span class="tag">' + esc(e.note) + '</span>' : '') +
        (url ? '<span class="src">Source: <a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(e.sourceLabel || url) + '</a></span>' : '') +
        (e.local ? '<button class="rm" data-id="' + esc(e.id) + '">Remove</button>' : '') + '</div></div></article>';
    });
    host.innerHTML = html;
    Array.prototype.forEach.call(host.querySelectorAll(".rm"), function (b) {
      b.onclick = function () {
        var o = loadLocal(); o[code] = (o[code] || []).filter(function (e) { return e.id !== b.getAttribute("data-id"); });
        saveLocal(o); renderList(code); toast("Entry removed");
      };
    });
  }

  /* ---------- add / export ---------- */
  var dlg = document.createElement("dialog"); dlg.setAttribute("aria-labelledby", "dlgt");
  dlg.innerHTML = '<form id="f" novalidate><h2 id="dlgt">Add an entry</h2><p class="hint" id="dlgh"></p>' +
    '<label for="f-title">Title *</label><input id="f-title" required>' +
    '<div class="row"><div><label for="f-years">Year or period *</label><input id="f-years" placeholder="2025 or 2024 to 2026" required></div>' +
    '<div><label for="f-type">Type</label><select id="f-type"><option>Activity</option><option>Policy</option><option>Memorandum</option><option>Publication</option><option>Research project</option><option>Study</option><option>Award</option><option>News</option><option>Other</option></select></div></div>' +
    '<label for="f-people">People or unit</label><input id="f-people">' +
    '<label for="f-summary">Description</label><textarea id="f-summary"></textarea>' +
    '<div class="row"><div><label for="f-label">Source name</label><input id="f-label" placeholder="MMSU News, 4 July 2025"></div><div><label for="f-url">Source link (https://)</label><input id="f-url" type="url" placeholder="https://"></div></div>' +
    '<label for="f-status">Verification</label><select id="f-status"><option>Verified on the source page</option><option>Search summary only</option><option>To verify</option></select>' +
    '<p class="hint" id="f-err" role="alert" style="color:#a11;margin-top:12px"></p>' +
    '<div class="actions"><button type="button" class="btn alt" id="f-cancel">Cancel</button><button type="submit" class="btn">Save entry</button></div></form>';
  document.body.appendChild(dlg);
  var curCode = null;
  function openForm(code) {
    curCode = code;
    document.getElementById("f").reset(); document.getElementById("f-err").textContent = "";
    document.getElementById("dlgh").textContent = "Indicator " + code + " · " + byCode[code].title + ". Saved in this browser; export to share.";
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    document.getElementById("f-title").focus();
  }
  document.getElementById("f-cancel").onclick = function () { dlg.close(); };
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var err = document.getElementById("f-err");
    if (!v("f-title") || !v("f-years")) { err.textContent = "Title and year are required."; return; }
    if (v("f-url") && !safeUrl(v("f-url"))) { err.textContent = "The source link must start with http:// or https://."; return; }
    var m = v("f-years").match(/(19|20)\d{2}/g);
    var entry = { id: "l" + Date.now(), years: v("f-years"), sortYear: m ? +m[m.length - 1] : new Date().getFullYear(), type: v("f-type"), title: v("f-title"),
      people: v("f-people"), summary: v("f-summary"), sourceLabel: v("f-label"), sourceUrl: v("f-url"), status: v("f-status") };
    var o = loadLocal(); (o[curCode] = o[curCode] || []).push(entry);
    if (!saveLocal(o)) { err.textContent = "This browser blocked saving. Use a normal window, or export is unavailable."; return; }
    dlg.close(); renderList(curCode); toast("Entry added to " + curCode);
  });
  var xdlg = document.createElement("dialog"); xdlg.setAttribute("aria-labelledby", "xt");
  xdlg.innerHTML = '<form method="dialog" id="xf"><h2 id="xt">Added entries</h2><p class="hint">Copy this text and send it to the site team to add the entries for everyone.</p>' +
    '<label for="x-text">Entries (JSON)</label><textarea id="x-text" readonly style="min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>' +
    '<div class="actions"><button type="button" class="btn alt" id="x-copy">Copy</button><button type="submit" class="btn">Close</button></div></form>';
  document.body.appendChild(xdlg);
  document.getElementById("x-copy").onclick = function () {
    var ta = document.getElementById("x-text");
    var fallback = function () { ta.focus(); ta.select(); toast("Text selected: copy it with your device's Copy"); };
    try { navigator.clipboard.writeText(ta.value).then(function () { toast("Copied"); }, fallback); } catch (e) { fallback(); }
  };
  function exportLocal() {
    var o = loadLocal(), n = 0; Object.keys(o).forEach(function (k) { n += o[k].length; });
    if (!n) { toast("No added entries to export yet"); return; }
    document.getElementById("x-text").value = JSON.stringify({ entries: o }, null, 2);
    if (xdlg.showModal) xdlg.showModal(); else xdlg.setAttribute("open", "");
  }
  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2400);
  }

  /* ---------- router ---------- */
  function route() {
    if (timer) { clearInterval(timer); timer = null; }
    var h = (location.hash || "").replace(/^#/, ""), m;
    if ((m = /^sdg-(\d{1,2})$/.exec(h)) && +m[1] >= 1 && +m[1] <= 17) { viewSdg(+m[1]); window.scrollTo(0, 0); return; }
    if ((m = /^ind-(\d+(?:-\d+){1,2})$/.exec(h))) { viewIndicator(m[1].replace(/-/g, ".")); window.scrollTo(0, 0); return; }
    viewHome(); window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("a[data-scroll]");
    if (!a) return;
    ev.preventDefault();
    var id = a.getAttribute("data-scroll");
    if (id === "top") { window.scrollTo(0, 0); return; }
    var el = document.getElementById(id); if (el) el.scrollIntoView();
  });
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
